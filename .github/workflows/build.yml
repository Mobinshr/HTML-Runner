name: Build APK
on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

# Serialize release publishing so overlapping pushes cannot delete a newer release.
concurrency:
  group: html-runner-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Android app version
        id: app_version
        shell: bash
        run: |
          VERSION_CODE=$(sed -nE "s/.*versionCode[[:space:]]+([0-9]+).*/\\1/p" app/build.gradle | head -n1)
          VERSION_NAME=$(sed -nE "s/.*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\\1/p" app/build.gradle | head -n1)

          if [ -z "$VERSION_CODE" ]; then
            echo "Could not read versionCode from app/build.gradle"
            exit 1
          fi
          if [ -z "$VERSION_NAME" ]; then
            echo "Could not read versionName from app/build.gradle"
            exit 1
          fi

          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Building HTML Runner v$VERSION_NAME (versionCode $VERSION_CODE)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Remove obsolete debug APK from this version
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ steps.app_version.outputs.tag }}
        run: |
          if gh release view "$CURRENT_TAG" >/dev/null 2>&1; then
            gh release delete-asset "$CURRENT_TAG" app-debug.apk --yes || true
          fi

      - name: Prepare permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mobin-apps-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mobin-apps-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Verify APK package, launcher icon, and signature
        shell: bash
        env:
          EXPECTED_VERSION_CODE: ${{ steps.app_version.outputs.code }}
          EXPECTED_VERSION_NAME: ${{ steps.app_version.outputs.name }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/html-runner-badging.txt"
          grep -F "package: name='com.mobin.htmlrunner' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'" "$RUNNER_TEMP/html-runner-badging.txt"
          grep -E "^application: .*icon='res/" "$RUNNER_TEMP/html-runner-badging.txt"
          echo "APK archive, app identity, launcher icon resource, and signing certificate verified."

      - uses: actions/upload-artifact@v4
        with:
          name: HTML-Runner-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish versioned APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.tag }}
          name: HTML Runner v${{ steps.app_version.outputs.name }}
          body: |
            ## HTML Runner v${{ steps.app_version.outputs.name }}

            Latest Android APK for HTML Runner.

            - **Version:** ${{ steps.app_version.outputs.name }}
            - **Package:** com.mobin.htmlrunner
            - **File:** app-release.apk

            Each release tag represents the app version. Rebuilding the same version updates this release instead of creating another numbered build.
          files: app/build/outputs/apk/release/app-release.apk
          make_latest: true
          fail_on_unmatched_files: true

      - name: Keep only the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ steps.app_version.outputs.tag }}
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ] && [ "$tag" != "$CURRENT_TAG" ]; then
              gh release delete "$tag" --yes --cleanup-tag
            fi
          done < <(gh release list --limit 100 --json tagName --jq '.[].tagName')
